<P><B><FONT size="+2">朝霞射撃場の入場について<BR>
<BR>

<BR>
「日本ライフル協会会員証」<BR>
及び<BR>
「運転免許証等」<BR>

（注：日ラ会員証は２０年度になっておりますが<BR>
２１年度は更新中と回答してください）<BR>
