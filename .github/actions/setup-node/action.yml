name: Setup Node.js
description: Install the repository's pinned Node.js, npm, and workspace dependencies
inputs:
  install-directory:
    description: Directory from which npm ci selects the workspace
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Pin npm
      shell: bash
      run: | # zizmor: ignore[adhoc-packages] -- npm is pinned in package.json
        NPM_VERSION=$(node -p 'require("./package.json").volta.npm')
        npm install --global "npm@$NPM_VERSION"
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.install-directory }}
      run: npm ci
