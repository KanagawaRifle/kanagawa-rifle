name: 改善提案
description: 機能の追加や改善を提案する。
labels:
  - 'Cat: Feature 🚀'
  - 'Status: Needs Triage 💡'
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: 対象のページや機能と、現在の問題を記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: どのように変わると使いやすくなりますか。
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 補足
      description: 参考になるサイトや画像、現在の回避方法があれば記載してください。
