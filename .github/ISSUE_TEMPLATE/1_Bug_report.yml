name: 不具合報告
description: サイトや開発環境の不具合を報告する。
labels:
  - 'Cat: Bug 🐛'
  - 'Status: Needs Triage 💡'
body:
  - type: input
    id: target
    attributes:
      label: 対象
      description: ページの URL、パッケージ名、実行したコマンドなど。
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 不具合の内容
      description: 起きたことと、期待していた動作を記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を記載してください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: ブラウザと OS のバージョン。開発環境の問題なら Node.js、npm、コミットも記載してください。
  - type: textarea
    id: additional-context
    attributes:
      label: 補足
      description: 関連するログや画像があれば添付してください。認証情報や個人情報は削除してください。
