name: Code Analysis

on:
  push:
    branches: [1.x, 2.x]
  pull_request:
    branches: [1.x, 2.x]
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: vars.CODE_SECURITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@480db559a14342288b67e54bd959dd52dc3ee68f # v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@480db559a14342288b67e54bd959dd52dc3ee68f # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@480db559a14342288b67e54bd959dd52dc3ee68f # v3
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Analyze JavaScript and TypeScript (OSS)
    if: vars.CODE_SECURITY_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Check out community analysis rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: semgrep/semgrep-rules
          ref: a84ff9cc2453ca91d581380de4b8b3f272f6f4be
          path: .semgrep-rules
          persist-credentials: false
      - name: Analyze source and fail on findings
        shell: bash
        run: |
          mkdir -p reports
          configs=()
          while IFS= read -r -d '' directory; do
            configs+=(--config "$directory")
          done < <(find .semgrep-rules/javascript .semgrep-rules/typescript -type d -name security -print0)
          test "${#configs[@]}" -gt 0
          semgrep scan "${configs[@]}" --exclude .semgrep-rules --exclude reports \
            --exclude '**/__tests__/**' --exclude '**/e2e/**' --exclude '*.test.*' --exclude '*.stories.*' \
            --error --strict \
            --metrics=off --disable-version-check --sarif --output reports/semgrep.sarif .
      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-analysis
          path: reports/semgrep.sarif
          if-no-files-found: error
