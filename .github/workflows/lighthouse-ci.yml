# .github/workflows/lighthouse-ci.yml
name: Lighthouse CI

on:
  pull_request:
    branches:
      - 1.x
      - 2.x

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node

      - name: Build website
        run: npm run -w @acme/website build
        env:
          NODE_ENV: production
          LHCI: 1

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        continue-on-error: true
        with:
          configPath: packages/website/.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse results
        id: format
        if: always() && steps.lighthouse.outputs.manifest != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          LINKS: ${{ steps.lighthouse.outputs.links }}
        with:
          script: |
            const results = JSON.parse(process.env.MANIFEST);
            const links = JSON.parse(process.env.LINKS || "{}");

            const formatScore = (score) => {
              if (score >= 0.9) return `🟢 ${Math.round(score * 100)}`;
              if (score >= 0.5) return `🟠 ${Math.round(score * 100)}`;
              return `🔴 ${Math.round(score * 100)}`;
            };

            let comment = '## Lighthouse CI Results\n\n';
            comment += '| URL | Performance | Accessibility | Best Practices | SEO |\n';
            comment += '|-----|-------------|---------------|----------------|-----|\n';

            for (const result of results) {
              const url = new URL(result.url).pathname || '/';
              const perf = formatScore(result.summary.performance);
              const a11y = formatScore(result.summary.accessibility);
              const bp = formatScore(result.summary['best-practices']);
              const seo = formatScore(result.summary.seo);
              comment += `| ${url} | ${perf} | ${a11y} | ${bp} | ${seo} |\n`;
            }

            comment += '\n### Report Links\n\n';
            for (const [url, link] of Object.entries(links)) {
              const pathname = new URL(url).pathname || '/';
              comment += `- [${pathname}](${link})\n`;
            }

            await core.summary.addRaw(comment).write();

      - name: Fail if Lighthouse failed
        if: always() && steps.lighthouse.outcome == 'failure'
        run: exit 1
