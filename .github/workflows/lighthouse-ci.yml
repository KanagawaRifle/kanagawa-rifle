# .github/workflows/lighthouse-ci.yml
name: Lighthouse CI

on:
  pull_request:
    branches:
      - 1.x
      - 2.x

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run -w @kanagawa-rifle/website build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: packages/website/.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse results
        id: format
        uses: actions/github-script@v7
        with:
          script: |
            const results = ${{ steps.lighthouse.outputs.manifest }};
            const links = ${{ steps.lighthouse.outputs.links }};

            const formatScore = (score) => {
              if (score >= 0.9) return `🟢 ${Math.round(score * 100)}`;
              if (score >= 0.5) return `🟠 ${Math.round(score * 100)}`;
              return `🔴 ${Math.round(score * 100)}`;
            };

            let comment = '## Lighthouse CI Results\n\n';
            comment += '| URL | Performance | Accessibility | Best Practices | SEO |\n';
            comment += '|-----|-------------|---------------|----------------|-----|\n';

            for (const result of results) {
              const url = new URL(result.url).pathname || '/';
              const perf = formatScore(result.summary.performance);
              const a11y = formatScore(result.summary.accessibility);
              const bp = formatScore(result.summary['best-practices']);
              const seo = formatScore(result.summary.seo);
              comment += `| ${url} | ${perf} | ${a11y} | ${bp} | ${seo} |\n`;
            }

            comment += '\n### Report Links\n\n';
            for (const [url, link] of Object.entries(links)) {
              const pathname = new URL(url).pathname || '/';
              comment += `- [${pathname}](${link})\n`;
            }

            core.setOutput('comment', comment);

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-ci
          message: ${{ steps.format.outputs.comment }}
