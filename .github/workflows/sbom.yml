name: SBOM
on:
  push:
    branches: [1.x, 2.x]
    paths: [package.json, package-lock.json, 'packages/*/package.json', .github/workflows/sbom.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Generate CycloneDX production dependency inventory
        run: npm sbom --sbom-format=cyclonedx --omit=dev > bom.json
      - name: Generate production license notices
        run: npm run license-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: |
            bom.json
            packages/website/THIRD-PARTY-LICENSES.txt
          retention-days: 30
