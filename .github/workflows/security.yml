name: Security

on:
  push:
    branches: [1.x, 2.x]
  pull_request:
    branches: [1.x, 2.x]
  schedule:
    - cron: '0 16 * * 0'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  osv-scan-push:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2
    with:
      upload-sarif: ${{ github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true' }}
      scan-args: |-
        --lockfile=package-lock.json

  osv-scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2
    with:
      upload-sarif: ${{ github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true' }}
      scan-args: |-
        --lockfile=package-lock.json
