name: Security

on:
  push:
    branches: [1.x, 2.x]
  pull_request:
    branches: [1.x, 2.x]
  schedule:
    - cron: '0 16 * * 0'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  osv-scan-push:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b8ac13f90f0ad78cebdcdbe5d39fcc8ff11301ba # v2
    with:
      upload-sarif: ${{ vars.CODE_SECURITY_ENABLED == 'true' }}
      scan-args: |-
        --lockfile=package-lock.json

  osv-scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@c51854704019a247608d928f370c98740469d4b5 # v2
    with:
      upload-sarif: ${{ vars.CODE_SECURITY_ENABLED == 'true' }}
      scan-args: |-
        --lockfile=package-lock.json
