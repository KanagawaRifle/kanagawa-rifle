# .github/workflows/test.yml
name: Test

on:
  push:
    branches: [1.x, 2.x]
  workflow_dispatch:
  pull_request:
    branches:
      - 1.x
      - 2.x

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Repository checks
        run: npm run check

      - name: Validate all news content
        run: npm run -w @acme/website test:content

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        working-directory: packages/website
        run: npm run test:coverage -- --coverage.reportOnFailure

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: packages/website/coverage/

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: packages/website/reports/vitest-junit.xml

      - name: Require coverage of changed code
        if: steps.test.outcome == 'success' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run coverage:diff -- --base "$BASE_SHA"

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Verify input validation tests with mutations
        run: npm run -w @acme/website test:mutation

  browser:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_URL: http://127.0.0.1:3100
      LHCI: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npx playwright install --with-deps chromium
        working-directory: packages/website
      - name: Build and test public pages
        run: npm run -w @acme/website test:e2e -- --project=chromium --project="Mobile Chrome"
      - name: Check initial JS and CSS size
        run: npm run -w @acme/website size-limit
      - name: Check local deployment endpoints
        run: node packages/website/scripts/local-smoke.mjs
      - name: Upload browser JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: packages/website/reports/playwright-junit.xml
      - name: Test development hydration
        run: npm run -w @acme/website test:e2e:dev -- --project=chromium --project="Mobile Chrome"
      - name: Build staging and verify authentication
        run: npm run -w @acme/website test:e2e:staging
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: packages/website/playwright-report/

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npx playwright install --with-deps chromium
        working-directory: packages/website
      - run: npm run -w @acme/website test:storybook
      - name: Upload Storybook results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-test-results
          path: packages/website/reports/storybook/

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Lint shell scripts, Dockerfiles, and workflows
        run: node scripts/lint-infra.mjs

  required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [test, browser, infrastructure, storybook]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-required-ci.mjs
