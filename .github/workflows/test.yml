# .github/workflows/test.yml
name: Test

on:
  pull_request:
    branches:
      - 1.x
      - 2.x

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check tracked files
        run: npm run lint:tracked

      - name: Lint
        run: npm run -w @acme/website lint:eslint

      - name: Check formatting
        run: npm run lint:prettier

      - name: Check architecture
        run: npm run lint:architecture

      - name: Typecheck
        run: npm run -w @acme/website typecheck

      - name: Validate all news content
        run: npm run -w @acme/website test:content

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        working-directory: packages/website
        run: npx vitest run --coverage --coverage.reportOnFailure

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/website/coverage/

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: packages/website

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  browser:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_URL: http://127.0.0.1:3100
      LHCI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: packages/website
      - name: Build and test public pages
        run: npm run -w @acme/website test:e2e -- --project=chromium --project="Mobile Chrome"
      - name: Test development hydration
        run: npm run -w @acme/website test:e2e:dev -- --project=chromium --project="Mobile Chrome"
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/website/playwright-report/
