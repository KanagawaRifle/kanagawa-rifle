name: Stale Issues

on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: ''
          stale-pr-message: ''
          days-before-stale: 60
          days-before-close: -1
          stale-issue-label: 'Status: Stale'
          stale-pr-label: 'Status: Stale'
          exempt-issue-labels: 'Status: Pinned,help wanted'
          exempt-pr-labels: 'Status: Pinned'
